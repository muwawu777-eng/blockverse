<script>window.BV_SERVER='wss://blockverse-server-530j.onrender.com'; // <- remplace par l'adresse de ton serveur
window.claude=(()=>{let ws,me=null,P={},cbs=[],ev={},sub=null,myP={},ready;
const up=new Promise(r=>ready=r);setTimeout(()=>ready(false),60000);
const send=o=>{if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))};
function open(){ws=new WebSocket(window.BV_SERVER);
ws.onopen=()=>{ready(true);if(Object.keys(myP).length)send({t:'p',d:myP});if(sub)send({t:'sub',w:sub.w})};
ws.onclose=()=>setTimeout(open,2500);
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
if(m.t=='me')me=m.id;else if(m.t=='warn')dispatchEvent(new Event('bvwarn'));
else if(m.t=='pl'){const old=P;P={};m.list.forEach(x=>P[x.id]={peer:x.id,isMe:x.id==me,presence:x.p});cbs.forEach(f=>f({peers:Object.values(P),joined:[],left:Object.keys(old).filter(k=>!P[k]).map(k=>old[k]),updated:[]}))}
else if(m.t=='e')(ev[m.topic]||[]).forEach(f=>f({data:m.data,isMe:false,peer:m.from}));
else if(sub&&m.w==sub.w){const ch=[];
if(m.t=='bl')m.list.forEach(([id,c])=>ch.push({type:'added',doc:{id,data:()=>({c})}}));
if(m.t=='bs')ch.push({type:'added',doc:{id:m.id,data:()=>({c:m.c})}});
if(m.t=='bd')ch.push({type:'removed',doc:{id:m.id,data:()=>({})}});
if(ch.length)sub.f({docChanges:()=>ch})}}}
const room={presence:async d=>{Object.assign(myP,d);send({t:'p',d})},onPeers:f=>{cbs.push(f);return()=>{}},on:(t,f)=>{(ev[t]=ev[t]||[]).push(f);return()=>{}},emit:async(t,d)=>send({t:'e',topic:t,data:d}),report:d=>send({t:'r',d})};
const db={collection:()=>({doc:id=>({set:async d=>send({t:'bs',w:d.w,id,c:d.c}),delete:async()=>send({t:'bd',w:+id.slice(1).split('_')[0],id})}),where:(f,o,w)=>({onSnapshot:fn=>{sub={w,f:fn};send({t:'sub',w});return()=>{sub=null}}})})};
open();return{use:async n=>(await up)?(n=='room'?room:n=='db'?db:null):null}})();
</script>
